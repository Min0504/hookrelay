global:
  scrape_interval: 5s
  evaluation_interval: 5s

# 호스트에서 띄운 api/worker/relay를 컨테이너 Prometheus가 긁는다.
# Docker Desktop / Compose v2+ 의 host-gateway.
scrape_configs:
  - job_name: hookrelay-api
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          component: api

  - job_name: hookrelay-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9091']
        labels:
          component: worker

  - job_name: hookrelay-relay
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:9092']
        labels:
          component: relay
